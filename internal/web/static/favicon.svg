<!-- Brand mark for /favicon.ico. This is a standalone SVG (no stylesheet), so
     it cannot resolve CSS var() - the scale greys mirror --scale-tick/--scale-base,
     the well gradient mirrors --well-hi/--well-lo, and the trace gradient mirrors
     --accent/--accent2 from index.html's :root. Keep them in sync. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="well" cx="30%" cy="22%" r="130%">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="0.7" stop-color="#1b1826"/>
    </radialGradient>
    <linearGradient id="trace" x1="3" y1="16" x2="29" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#9a6bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#well)"/>
  <rect width="32" height="32" rx="9" fill="none" stroke="#9a6bff" stroke-opacity=".28"/>
  <!-- graduated scale -->
  <g stroke="#7a72a0" stroke-width="1.4" opacity=".55" stroke-linecap="round">
    <path d="M6 24v2.4M11.5 24v2.4M17 24v2.4M22.5 24v2.4M28 24v2.4"/>
  </g>
  <path d="M5 22.8H29" stroke="#56507a" stroke-width="1.4" opacity=".5" stroke-linecap="round"/>
  <!-- probe trace -->
  <path d="M5 16.5 9 16.5 12 8.5 16.5 23.5 20.5 11.5 24 16.5 29 16.5"
        fill="none" stroke="url(#trace)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
