name: Checks and images

on:
  push:
    # Only the long-lived branches and release tags publish or release. PR
    # runs cover every feature and Dependabot branch without duplicating the
    # push run for the same SHA.
    branches:
      - main
      - testing
    tags:
      - 'v*'
    # Docs and site-only pushes never cut a release or rebuild images. Their
    # Markdown links, anchors, site build and typography are validated by
    # docs.yml instead of rebuilding this whole matrix.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/security.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A release run must finish. Superseded PR and testing runs are safe to
  # cancel; main and tag runs are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/testing' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate clean source identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # HEAD is the checked-out commit for both branch and annotated-tag
          # events. github.sha can name the tag object itself for a tag push.
          revision="$(git rev-parse HEAD)"
          args=(release -revision "$revision")
          if [ -n "$RELEASE_TAG" ]; then args+=(-tag "$RELEASE_TAG"); fi
          bash scripts/check.sh "${args[@]}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache Playwright browsers
        # Only the browser download is reusable. The install step below still
        # runs on every job, so OS dependencies are always refreshed and no
        # check can be skipped. requirements-dev.txt owns the Python Playwright
        # pin that installs Chromium; package-lock.json covers unrelated Node
        # tooling, so it must not invalidate the browser cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Check source and unit tests
        run: bash scripts/check.sh
      - name: Check isolated browser fixtures
        env:
          DEV_PORT: "18081"
          DEV_HOST: "127.0.0.1"
          DEV_DB: "/tmp/millivolt/millivolt-dev-ci.db"
          DEV_CONFIG: "proxy.example.yaml"
          DEV_COPY_DB: "0"
          # The dev instance and the browser harnesses share this operator
          # credential: the dashboard gate is fail closed, and the harnesses
          # sign in through it for gated fixture cleanup.
          MILLIVOLT_OPERATOR_TOKEN: "ci-browser-fixture-credential"
        run: |
          trap 'scripts/dev.sh stop' EXIT
          scripts/dev.sh up
          bash scripts/check.sh browser --target "http://${DEV_HOST}:${DEV_PORT}"
          # The live MCP integration test runs HERE, not in the core job: this
          # step already has a dev instance and an operator token, and the test
          # takes a port and a scratch database of its own, so it cannot disturb
          # the browser fixture. In the core job it would mean a second proxy in
          # a source-and-unit suite, which is the wrong place for it. It used to
          # be manual, and a regression in the audit lifecycle or the purge
          # guards would merge green; it is opt-in only for local runs.
          MILLIVOLT_MCP_INTEGRATION=1 bash scripts/check.sh go test -count=1 ./internal/mcp/...

  container:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: millivolt-container-linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: millivolt-container-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image without publishing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: millivolt:check
          build-args: REVISION=${{ github.sha }}
          # Each native matrix leg owns one scope: the amd64 and arm64 layer
          # graphs never share or overwrite a cache object. mode=max exports
          # the Go module and build layers, where the time is actually spent.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          # Cache export is an accelerator, never a gate: a throttled or
          # read-only cache must not fail the build or its checks.
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true
      - name: Check isolated container
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash scripts/check.sh container --image "$IMAGE_ID"

  required:
    name: required
    # One stable check for branch protection. A skipped matrix leg must fail
    # the gate rather than silently satisfy it.
    if: always()
    needs: [checks, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

      # Main is promoted from testing. Dependabot security updates are the one
      # documented exception because GitHub opens them against the default
      # branch; they still pass the same checks and are merged back afterwards.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: success() && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          fetch-depth: 0
      - name: Require main promotions to come from testing
        if: success() && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin testing
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/testing; then
            echo "::error::Main promotions must use commits already on testing."
            exit 1
          fi

  publish:
    needs: [checks, container]
    if: github.event_name == 'push' && github.repository == 'LLM-4-People/millivolt' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cut the next version
        id: cut
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A manually pushed release tag ships exactly as tagged. HEAD is
            # the commit even when the tag object is annotated.
            version="${GITHUB_REF_NAME#v}"
            revision="$(git rev-parse HEAD)"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
            file_version="$(tr -d '\r\n' < VERSION)"
            # The higher of VERSION and the newest tag owns the base: a
            # promotion merge carrying an older VERSION self-heals instead of
            # regressing a published release.
            target="$(printf '%s\n%s\n' "$file_version" "$latest" | sort -V | tail -n1)"
            if git rev-parse -q --verify "refs/tags/v$target" >/dev/null; then
              # That version is already released and code changed since it:
              # cut the next patch (dropping any prerelease suffix).
              base="${target%%-*}"
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            else
              # An untagged VERSION (manual bump or promotion) ships as-is.
              version="$target"
            fi
            # Both annotated tags and possible VERSION commits need an identity.
            git config user.name "millivolt-release-bot"
            git config user.email "millivolt-release-bot@users.noreply.github.com"
            if [ "$version" != "$file_version" ]; then
              printf '%s\n' "$version" > VERSION
              git add VERSION
              git commit -m "bump version to $version"
            fi
            revision="$(git rev-parse HEAD)"
            git tag -a "v$version" -m "millivolt $version" "$revision"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate release identity
        id: release
        env:
          REVISION: ${{ steps.cut.outputs.revision }}
          RELEASE_TAG: v${{ steps.cut.outputs.version }}
        run: |
          args=(release -revision "$REVISION" -tag "$RELEASE_TAG")
          bash scripts/check.sh "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Define image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/llm-4-people/millivolt
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' && !contains(env.RELEASE_VERSION, '-') }}
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            # Source the sha tag from the cut revision the build and OCI
            # revision label use. The cut step may create a VERSION commit
            # after the triggering SHA, so type=sha would name code this
            # image does not contain.
            type=raw,value=sha-${{ steps.cut.outputs.revision }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' && !contains(env.RELEASE_VERSION, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ steps.cut.outputs.revision }}
            org.opencontainers.image.source=https://github.com/LLM-4-People/millivolt
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ steps.cut.outputs.revision }}
          # Reuse both native check scopes, which already hold the expensive
          # Go layers for each platform. Export only the final image layers
          # under a publish-only scope: a max export here would duplicate both
          # platform graphs into the repository's shared 10 GB cache budget.
          cache-from: |
            type=gha,scope=millivolt-container-linux-amd64
            type=gha,scope=millivolt-container-linux-arm64
          cache-to: type=gha,mode=min,scope=millivolt-publish-multiarch,ignore-error=true
      - name: Push verified revision and tag
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The tag and main move only after the image exists. A failed build
          # must not leave a public release pointing at a missing image.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:main" "v$RELEASE_VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Notes come from the real commit log since the previous release
          # tag (push-based work has no PRs for --generate-notes to list).
          previous="$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')"
          {
            echo "## What's included"
            if [ -n "$previous" ]; then
              git log --no-merges --no-decorate --format='- %h %s' "$previous..v$RELEASE_VERSION" \
                | awk '{ subject=$0; sub(/^- [0-9a-f]+ /, "", subject); if (subject ~ /^bump version to /) next; if (seen[subject]++) next; print }'
            else
              git log --no-merges --no-decorate --format='- %h %s' \
                | awk '{ subject=$0; sub(/^- [0-9a-f]+ /, "", subject); if (subject ~ /^bump version to /) next; if (seen[subject]++) next; print }'
            fi
            echo
            echo "**Image:** \`ghcr.io/llm-4-people/millivolt:${RELEASE_VERSION}\`"
            if [ -n "${{ steps.image.outputs.digest }}" ]; then
              echo "**Digest:** \`${{ steps.image.outputs.digest }}\`"
            fi
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/LLM-4-People/millivolt/compare/${previous}...v${RELEASE_VERSION}"
            fi
          } > release-notes.md
          flags=(--verify-tag --title "millivolt $RELEASE_VERSION" --notes-file release-notes.md)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release view "v$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "v$RELEASE_VERSION" "${flags[@]}"

  publish-testing:
    needs: [checks, container]
    # A moving development alias, not a release: every code-bearing push to
    # testing republishes one tag after the same gates as main. No version
    # is cut and no release is created.
    if: github.event_name == 'push' && github.repository == 'LLM-4-People/millivolt' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-testing
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the testing version
        id: version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish testing image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/llm-4-people/millivolt:testing
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/LLM-4-People/millivolt
            org.opencontainers.image.licenses=MIT
          build-args: REVISION=${{ github.sha }}
          # Same reuse and bounded-export policy as publish, with a separate
          # scope so testing never overwrites or evicts the release cache.
          cache-from: |
            type=gha,scope=millivolt-container-linux-amd64
            type=gha,scope=millivolt-container-linux-arm64
          cache-to: type=gha,mode=min,scope=millivolt-publish-testing-multiarch,ignore-error=true
