name: Checks and images

# Promotion policy:
# - `main` accepts pull requests only. The `main-testing-first` ruleset requires
#   the `required` check and a merge commit, and it has no bypass actors.
# - Full checks and native container smoke tests run on all testing pull
#   requests and code-bearing testing pushes, manual release tags, and
#   Dependabot's main PRs. Docs and site-only testing pushes use docs.yml
#   instead. The full gate does not run again for an ordinary main promotion PR
#   or a code-bearing main push: those reuse the testing gate. The promotion PR
#   proves the head is the current testing tip, main is already merged back into
#   testing, and the canonical check.yml push run's own suite succeeded for that
#   exact commit or for the closest gated testing commit plus a docs-only delta,
#   with VERSION unreleased for code. The fallback selects the closest gated
#   testing commit from canonical push runs with no commit-count bound. The
#   proof polls a bounded number of times for pending exact runs and fails
#   closed if they are still pending. This keeps the release path from
#   re-running the same suite.
# - A non-Dependabot pull request to `main` must have its head commit be the
#   current `testing` tip, with `main` already merged back into `testing`. A
#   code-bearing promotion must also carry a VERSION newer than every existing
#   release tag; a docs/site-only promotion skips that check and does not
#   rebuild images or cut a release. Docs-only promotions instead validate
#   Markdown, the generated site, workflow policy and docs contracts in
#   `required`, so the docs workflow is not the only validation.
# - Dependabot security pull requests are the only exception. They still run the
#   full gate. They normally create no release because their VERSION is already
#   tagged; if main still carries an untagged pending VERSION, that merge can
#   publish the pending version.
# - `publish` tags the reviewed promotion merge and never pushes `main`. It
#   waits for `required`, which is the stable gate on every event. A merged
#   promotion PR is the primary release trigger: the `pull_request: closed`
#   event carries the exact merge commit and does not depend on GitHub
#   delivering a separate `main` push event. A code-bearing main push, when
#   delivered, only reuses the reviewed merge and publishes; it does not
#   re-prove the promotion checks.
# - Every release path uses the same idempotency key, the version tag. The
#   merged-PR event, a delivered main push, and a manual tag push can all
#   arrive for one revision; the release concurrency group serializes them and
#   the first tag wins.

on:
  push:
    # Only the long-lived branches and release tags publish or release. PR
    # runs cover every feature and Dependabot branch without duplicating the
    # push run for the same SHA.
    branches:
      - main
      - testing
    tags:
      - 'v*'
    # Docs and site-only pushes never cut a release or rebuild images. Their
    # Markdown links, anchors, site build and typography are validated by
    # docs.yml instead of rebuilding this whole matrix.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/dependency-review.yml'
      - '.github/workflows/security.yml'
  pull_request:
    # `closed` is the release trigger for a merged promotion. The other types
    # preserve the normal pull-request gate. The job conditions below ignore
    # a closed PR that did not merge into main.
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A release run must finish. Superseded PR and testing runs are safe to
  # cancel; a merged-PR release, main and tag runs are not.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.ref == 'refs/heads/testing' }}

jobs:
  checks:
    # Reuse the testing gate for a normal promotion. Dependabot opens its
    # security PRs against main, so those still need the full gate. Tag pushes
    # are included because a manually pushed release tag must be gated too.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/testing' || github.ref_type == 'tag')) ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
        (github.base_ref != 'main' ||
          github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate clean source identity
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          # HEAD is the checked-out commit for both branch and annotated-tag
          # events. github.sha can name the tag object itself for a tag push.
          revision="$(git rev-parse HEAD)"
          args=(release -revision "$revision")
          if [ -n "$RELEASE_TAG" ]; then args+=(-tag "$RELEASE_TAG"); fi
          bash scripts/check.sh "${args[@]}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Cache Playwright browsers
        # Only the browser download is reusable. The install step below still
        # runs on every job, so OS dependencies are always refreshed and no
        # check can be skipped. requirements-dev.txt owns the Python Playwright
        # pin that installs Chromium; package-lock.json covers unrelated Node
        # tooling, so it must not invalidate the browser cache.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Check source and unit tests
        run: bash scripts/check.sh
      - name: Check isolated browser fixtures
        env:
          DEV_PORT: "18081"
          DEV_HOST: "127.0.0.1"
          DEV_DB: "/tmp/millivolt/millivolt-dev-ci.db"
          DEV_CONFIG: "proxy.example.yaml"
          DEV_COPY_DB: "0"
          # The dev instance and the browser harnesses share this operator
          # credential: the dashboard gate is fail closed, and the harnesses
          # sign in through it for gated fixture cleanup.
          MILLIVOLT_OPERATOR_TOKEN: "ci-browser-fixture-credential"
        run: |
          trap 'scripts/dev.sh stop' EXIT
          scripts/dev.sh up
          bash scripts/check.sh browser --target "http://${DEV_HOST}:${DEV_PORT}"
          # The live MCP integration test runs HERE, not in the core job: this
          # step already has a dev instance and an operator token, and the test
          # takes a port and a scratch database of its own, so it cannot disturb
          # the browser fixture. In the core job it would mean a second proxy in
          # a source-and-unit suite, which is the wrong place for it. It used to
          # be manual, and a regression in the audit lifecycle or the purge
          # guards would merge green; it is opt-in only for local runs.
          MILLIVOLT_MCP_INTEGRATION=1 bash scripts/check.sh go test -count=1 ./internal/mcp/...

  container:
    name: container (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache_scope: millivolt-container-linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache_scope: millivolt-container-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image without publishing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: millivolt:check
          build-args: REVISION=${{ github.sha }}
          # Each native matrix leg owns one scope: the amd64 and arm64 layer
          # graphs never share or overwrite a cache object. mode=max exports
          # the Go module and build layers, where the time is actually spent.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          # Cache export is an accelerator, never a gate: a throttled or
          # read-only cache must not fail the build or its checks.
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true
      - name: Check isolated container
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash scripts/check.sh container --image "$IMAGE_ID"

  required:
    name: required
    # One stable check for branch protection. A skipped matrix leg must fail
    # the gate rather than silently satisfy it, except for the deliberate
    # main-promotion reuse path where the full gate and its dependent container
    # job are both skipped together. The ten-minute budget leaves room for the
    # docs-only validation path (dependency install, site build, repository and
    # workflow contracts, and the MCP package contracts).
    # A closed PR only needs this gate when it merged into main. Closed PRs to
    # testing, and unmerged PRs, do not publish.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.action != 'closed' ||
       (github.event.pull_request.merged == true && github.base_ref == 'main'))
    needs: [checks, container]
    outputs:
      merged_docs_only: ${{ steps.merged.outputs.docs_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      # Single owner of the docs/site filter shared by the promotion
      # classification and the docs-delta gate proof. These case globs match
      # the explicit check.yml push paths-ignore family: `**/*.md` becomes
      # `*.md` because a case `*` also matches `/`, and the four docs/site
      # workflow entries stay literal. check.yml is intentionally code-bearing
      # and is never part of this family.
      DOCS_PATH_PATTERNS: >-
        docs/** site-src/** scripts/build_site.py requirements-docs.txt LICENSE
        *.md .github/workflows/docs.yml .github/workflows/pages.yml
        .github/workflows/dependency-review.yml .github/workflows/security.yml
    steps:
      - name: Require every gate
        # A skipped matrix leg must fail the gate, except for the deliberate
        # main-promotion reuse path where both the full gate and its dependent
        # container job are skipped together. Any failure or cancellation still
        # fails, and a Dependabot main PR is never allowed to skip the gate.
        if: >-
          always() &&
          (contains(needs.*.result, 'failure') ||
           contains(needs.*.result, 'cancelled') ||
           (contains(needs.*.result, 'skipped') &&
            !(needs.checks.result == 'skipped' &&
              needs.container.result == 'skipped' &&
              ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
               (github.event_name == 'pull_request' && github.base_ref == 'main' &&
                (github.event.action == 'closed' && github.event.pull_request.merged == true ||
                 github.event.pull_request.user.login != 'dependabot[bot]'))))))
        run: exit 1

      # A merged promotion PR releases from the merge event itself. GitHub
      # occasionally drops a main push event after updating the ref; the
      # merged-PR payload still carries the exact merge commit, base and head.
      # Validate that identity and the reviewed head's required check before
      # publish is allowed to tag anything.
      - name: Validate merged promotion
        id: merged
        if: >-
          success() && github.event_name == 'pull_request' &&
          github.event.action == 'closed' && github.base_ref == 'main' &&
          github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_SHA" ] || [ -z "$HEAD_SHA" ] || [ -z "$BASE_SHA" ]; then
            echo "::error::Merged promotion event is missing its merge, head or base SHA."
            exit 1
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Merged promotion head is not this repository: ${HEAD_REPO:-missing}."
            exit 1
          fi

          parents="$(gh api "repos/$REPO/git/commits/$MERGE_SHA" --jq '.parents[].sha')"
          first="$(printf '%s\n' "$parents" | sed -n '1p')"
          second="$(printf '%s\n' "$parents" | sed -n '2p')"
          if [ "$first" != "$BASE_SHA" ] || [ "$second" != "$HEAD_SHA" ]; then
            echo "::error::Merge commit $MERGE_SHA does not join base $BASE_SHA and reviewed head $HEAD_SHA."
            exit 1
          fi

          main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$main_sha" != "$MERGE_SHA" ]; then
            status="$(gh api "repos/$REPO/compare/$MERGE_SHA...main" --jq .status)"
            case "$status" in
              ahead|identical) ;;
              *)
                echo "::error::main does not contain merge commit $MERGE_SHA (compare status: $status)."
                exit 1
                ;;
            esac
          fi

          # A closed-event required job is itself in progress. Ignore
          # incomplete check runs and require the latest completed reviewed
          # `required` check to be green.
          latest_required="$(gh api --paginate --slurp \
            "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" |
            jq -r '
              [.[].check_runs[]
                | select(.name == "required" and .status == "completed")]
              | sort_by(.completed_at // .started_at // "", .id)
              | last
              | if . == null then "" else (.conclusion // "") end')"
          if [ "$latest_required" != "success" ]; then
            echo "::error::The reviewed head $HEAD_SHA has no successful required check (latest completed: ${latest_required:-missing})."
            exit 1
          fi

          # Preserve the docs/site-only release-free policy. The PR file list
          # is authoritative for what the reviewed change touched; include a
          # rename's previous path so a code-to-docs rename cannot hide code.
          is_docs_path() {
            local path="$1" pattern
            local -a docs_patterns=()
            if [ -n "${DOCS_PATH_PATTERNS:-}" ]; then
              read -r -a docs_patterns <<< "$DOCS_PATH_PATTERNS"
            fi
            for pattern in "${docs_patterns[@]}"; do
              case "$path" in
                $pattern) return 0 ;;
              esac
            done
            return 1
          }
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          docs_only=true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! is_docs_path "$path"; then
              docs_only=false
              break
            fi
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Merged promotion validated: $MERGE_SHA (docs_only=$docs_only)."

      # Main is promoted from testing. Dependabot security updates are the one
      # documented exception because GitHub opens them against the default
      # branch; both promotion checks are skipped for them, but they still pass
      # the full gate and are merged back afterwards.
      - name: Check out the promotion merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go for promotion validation
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Require main promotions to come from testing
        id: promotion
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main testing
          if ! git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            echo "::error::Merge main back into testing before promoting; main must be an ancestor of the head commit."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$(git rev-parse origin/testing)" ]; then
            echo "::error::Promote the current testing tip; the pull-request head is not origin/testing."
            exit 1
          fi
          # DOCS_PATH_PATTERNS is the single docs/site filter, aligned with the
          # push paths-ignore filter above. A docs-only promotion skips the
          # VERSION gate and does not rebuild images or cut a release after
          # merge. --no-renames keeps both sides of a code-to-docs rename, so a
          # rename can never hide a code change from this classification.
          #
          # This checkout is candidate code. `required` reviews that code, so
          # the matcher is defined here instead of sourcing a script from the
          # candidate tree. The full-gate proof below carries the same copy,
          # and the workflow tests pin the two declarations byte-identical.
          # The real protection is the current-tip rule and review, not this
          # filter.
          is_docs_path() {
            local path="$1" pattern
            local -a docs_patterns=()
            if [ -n "${DOCS_PATH_PATTERNS:-}" ]; then
              read -r -a docs_patterns <<< "$DOCS_PATH_PATTERNS"
            fi
            for pattern in "${docs_patterns[@]}"; do
              case "$path" in
                $pattern) return 0 ;;
              esac
            done
            return 1
          }
          base="$(git merge-base origin/main "$HEAD_SHA")"
          # Capture the diff before classifying it. A failing `git diff` must
          # abort under `set -e`; inside a process substitution its status is
          # lost and an empty loop would leave docs_only=true.
          changed="$(git diff --name-only --no-renames "$base" "$HEAD_SHA")"
          docs_only=true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! is_docs_path "$path"; then
              docs_only=false
              break
            fi
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - name: Require the full testing gate for the promoted commit
        # The normal promotion path does not rerun the suite. It proves the
        # canonical check.yml push run for the exact commit (or the closest
        # gated testing ancestor) completed successfully and that its own check
        # suite contains completed, successful `checks` and both native
        # container legs. The workflow path, push event, testing branch and
        # suite id are all part of the selector, so a forged workflow, a
        # pull-request run, or names from another suite can never stand in for
        # the full gate. A docs-only commit pushed after the closest gated
        # testing commit reuses that gate when the delta contains only docs
        # paths, because check.yml deliberately skips docs pushes; the fallback
        # selects the closest gated commit from canonical push runs, with no
        # commit bound.
        # Pending exact runs get six bounded 10-second polls; the proof fails
        # closed if they are still pending. A successful duplicate wins over
        # cancelled leftovers from a re-run within the canonical suite.
        # Dependabot and docs-only promotions are handled by their own
        # exceptions.
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.promotion.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The candidate checkout is untrusted: `required` reviews candidate
          # code, so this matcher is duplicated inline instead of sourcing a
          # script from the checkout. The promotion classification step carries
          # the same copy; the workflow tests pin them byte-identical.
          # DOCS_PATH_PATTERNS is the single owner of the glob family.
          is_docs_path() {
            local path="$1" pattern
            local -a docs_patterns=()
            if [ -n "${DOCS_PATH_PATTERNS:-}" ]; then
              read -r -a docs_patterns <<< "$DOCS_PATH_PATTERNS"
            fi
            for pattern in "${docs_patterns[@]}"; do
              case "$path" in
                $pattern) return 0 ;;
              esac
            done
            return 1
          }
          fetch_workflow_runs() {
            gh api --paginate --slurp "repos/$REPO/actions/runs?$1&per_page=100" |
              jq '{workflow_runs: [.[].workflow_runs[]]}'
          }
          fetch_check_runs() {
            # filter=all returns superseded and duplicate check runs, not only
            # each name's latest attempt. A re-run that leaves a cancelled
            # duplicate in the canonical suite would otherwise hide the
            # successful run this proof needs.
            gh api --paginate --slurp "repos/$REPO/commits/$1/check-runs?filter=all&per_page=100" |
              jq '{check_runs: [.[].check_runs[]]}'
          }
          # canonical_runs is the one selector for a check.yml testing push run.
          # The path, event and branch filters are all mandatory, so an extra
          # workflow or a pull-request run can never satisfy the proof. Newest
          # first; created_at ties break on the run id.
          canonical_runs() {
            printf '%s' "$1" | jq -c '
              [ .workflow_runs[]
                | select(.path == ".github/workflows/check.yml")
                | select(.event == "push")
                | select(.head_branch == "testing")
                | {head_sha, status, conclusion, check_suite_id, created_at, id}
              ]
              | sort_by(.created_at, .id)
              | reverse
              | .[]'
          }
          # canonical_run picks the newest canonical run for one exact commit.
          canonical_run() {
            printf '%s' "$1" | jq -c --arg sha "$2" '
              [ .workflow_runs[]
                | select(.path == ".github/workflows/check.yml")
                | select(.event == "push")
                | select(.head_branch == "testing")
                | select(.head_sha == $sha)
              ]
              | sort_by(.created_at, .id)
              | last
              | if . == null then empty else {status, conclusion, check_suite_id} end'
          }
          # suite_outcome classifies only the check runs that belong to the
          # canonical workflow run's suite. A successful duplicate wins over
          # cancelled or failed leftovers from a re-run, and a pending duplicate
          # is polled before a duplicate failure is considered.
          suite_outcome() {
            printf '%s' "$1" | jq -r --argjson suite "$2" '
              [ (.check_runs // [])[]
                | select(.check_suite.id == $suite)
                | select(.name == "checks" or .name == "container (linux/amd64)" or .name == "container (linux/arm64)")
              ] as $entries
              | [ $entries[] | select(.status == "completed" and .conclusion == "success") | .name ] | unique as $success
              | if ($success | length) == 3 then "success"
                elif ([ $entries[] | select(.status != "completed") ] | length) != 0 then "pending"
                elif ([ $entries[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") ] | length) != 0 then "failed"
                else "incomplete" end'
          }
          observed() {
            printf '%s\n' "$1" | jq -r '(.check_runs // [])[] | "\(.name) [suite \(.check_suite.id // "none")]: \(.status)/\(.conclusion // "pending")"'
          }
          runs="$(fetch_workflow_runs "head_sha=$HEAD_SHA")"
          run="$(canonical_run "$runs" "$HEAD_SHA")"
          if [ -n "$run" ]; then
            run_status="$(printf '%s' "$run" | jq -r '.status')"
            run_conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
            suite="$(printf '%s' "$run" | jq -r '.check_suite_id // 0')"
            payload="$(fetch_check_runs "$HEAD_SHA")"
            outcome="$(suite_outcome "$payload" "$suite")"
            for attempt in 1 2 3 4 5 6; do
              if [ "$run_status" = "completed" ] && [ "$outcome" != "pending" ]; then break; fi
              echo "The canonical check.yml push run for $HEAD_SHA is still in flight; waiting 10 seconds ($attempt/6)."
              sleep 10
              runs="$(fetch_workflow_runs "head_sha=$HEAD_SHA")"
              run="$(canonical_run "$runs" "$HEAD_SHA")"
              if [ -z "$run" ]; then
                run_status="missing"
                run_conclusion=""
                break
              fi
              run_status="$(printf '%s' "$run" | jq -r '.status')"
              run_conclusion="$(printf '%s' "$run" | jq -r '.conclusion // ""')"
              suite="$(printf '%s' "$run" | jq -r '.check_suite_id // 0')"
              payload="$(fetch_check_runs "$HEAD_SHA")"
              outcome="$(suite_outcome "$payload" "$suite")"
            done
            if [ "$run_status" != "completed" ]; then
              echo "::error::The canonical check.yml push run for $HEAD_SHA was still pending after the bounded wait."
              observed "$payload"
              exit 1
            fi
            if [ "$run_conclusion" != "success" ]; then
              echo "::error::The canonical check.yml push run for $HEAD_SHA completed as ${run_conclusion:-unknown}."
              observed "$payload"
              exit 1
            fi
            if [ "$outcome" != "success" ]; then
              echo "::error::The canonical check.yml push run for $HEAD_SHA succeeded but its check suite is $outcome."
              observed "$payload"
              exit 1
            fi
            echo "The canonical check.yml push run and its gate suite succeeded for $HEAD_SHA."
            exit 0
          fi

          # No canonical check.yml push run exists for the exact head. A
          # docs-only commit pushed to testing does not trigger check.yml, so
          # reuse the closest canonical gated testing ancestor. The run list is
          # paginated, so the proof is not bounded by a commit count. "Closest"
          # is the ancestor with the smallest `git rev-list --count
          # "$candidate..$HEAD_SHA"` distance, never the most recently created
          # run: a re-run of an older commit must not outrank a commit that is
          # nearer the head. Duplicate runs for one commit keep the newest
          # created run; an equal distance keeps the first in that order.
          # After selecting the commit, its own suite must have passed. If it
          # did not, the proof fails closed rather than reaching further back
          # past an ungated or failed code commit. Every path between that
          # gated commit and this head must be docs/site-only. --no-renames
          # keeps both sides of a rename, matching the promotion
          # classification.
          echo "No canonical check.yml push run exists for $HEAD_SHA; checking the closest gated testing ancestor."
          runs="$(fetch_workflow_runs "branch=testing&event=push")"
          gated=""
          gated_suite=""
          gated_status=""
          gated_conclusion=""
          gated_distance=""
          while IFS=$'\t' read -r candidate suite candidate_status candidate_conclusion; do
            [ -n "$candidate" ] || continue
            [ "$candidate" != "$HEAD_SHA" ] || continue
            if ! git merge-base --is-ancestor "$candidate" "$HEAD_SHA"; then
              continue
            fi
            distance="$(git rev-list --count "$candidate..$HEAD_SHA")"
            case "$distance" in
              ''|*[!0-9]*)
                echo "::error::Cannot measure the distance from $candidate to $HEAD_SHA."
                exit 1
                ;;
            esac
            if [ -n "$gated_distance" ] && [ "$distance" -ge "$gated_distance" ]; then
              continue
            fi
            gated="$candidate"
            gated_suite="$suite"
            gated_status="$candidate_status"
            gated_conclusion="$candidate_conclusion"
            gated_distance="$distance"
          done < <(canonical_runs "$runs" | jq -r '[.head_sha, (.check_suite_id // 0), .status, (.conclusion // "")] | @tsv')
          if [ -z "$gated" ]; then
            echo "::error::No canonical check.yml push run on testing is a gated ancestor of $HEAD_SHA."
            exit 1
          fi
          if [ "$gated_status" != "completed" ]; then
            echo "::error::The closest canonical check.yml push run at $gated is still pending; the proof fails closed."
            exit 1
          fi
          if [ "$gated_conclusion" != "success" ]; then
            echo "::error::The closest canonical check.yml push run at $gated completed as ${gated_conclusion:-unknown}; it cannot gate $HEAD_SHA."
            exit 1
          fi
          payload="$(fetch_check_runs "$gated")"
          outcome="$(suite_outcome "$payload" "$gated_suite")"
          case "$outcome" in
            success)
              ;;
            pending)
              echo "::error::The closest canonical check.yml push run at $gated is still pending; the proof fails closed."
              observed "$payload"
              exit 1
              ;;
            *)
              echo "::error::The closest canonical check.yml push run at $gated did not pass ($outcome); it cannot gate $HEAD_SHA."
              observed "$payload"
              exit 1
              ;;
          esac
          changed="$(git diff --name-only --no-renames "$gated" "$HEAD_SHA")"
          non_docs=""
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! is_docs_path "$path"; then
              non_docs="${non_docs}${path}"$'\n'
            fi
          done <<< "$changed"
          if [ -n "$non_docs" ]; then
            echo "::error::$HEAD_SHA changes non-docs paths after the gated commit $gated, so it needs its own full gate."
            printf '%s' "$non_docs"
            exit 1
          fi
          echo "The latest canonical testing gate succeeded for $gated; only docs paths changed through $HEAD_SHA."
          exit 0
      - name: Set up Python for docs-only validation
        # A docs-only promotion skips the full gate, so validate Markdown, the
        # generated site, workflow policy and docs contracts here; the separate
        # docs workflow is not the only validation. Dependabot is excluded
        # because its PR already runs the full gate.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.promotion.outputs.docs_only == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Validate the docs-only promotion
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.promotion.outputs.docs_only == 'true'
        env:
          GOTOOLCHAIN: local
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-docs.txt
          python3 -B -O -m tests.python.site
          python3 -B -O -m tests.python.repository
          python3 -B -O -m tests.python.workflows
          python3 -B -m tests.repository_check
          python3 -B -m tests.go test -mod=readonly ./internal/mcp -count=1
      - name: Require an unreleased version for main promotions
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' && steps.promotion.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            go run -mod=readonly ./cmd/release -newer-than "${tag#v}" >/dev/null
          done < <(git tag -l 'v*')
      - name: Summarize the main promotion
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          {
            echo "### Main promotion"
            echo "- Head commit is main's merged-back history and the current testing tip."
            if [ "${{ steps.promotion.outputs.docs_only }}" = "true" ]; then
              echo "- This is a docs/site-only promotion. The VERSION and full-gate checks are skipped, docs, workflow policy and site validation ran here, and the merge will not rebuild images or cut a release."
            else
              echo "- The full testing gate succeeded for this commit, or for the closest gated testing commit with only docs changes after it."
              echo "- VERSION is newer than every existing release tag."
            fi
            echo "- Merge with a merge commit. CI tags this merge and never pushes main."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize the Dependabot exception
        if: success() && github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          {
            echo "### Dependabot security promotion"
            echo "- The testing-ancestry and VERSION checks are skipped for this PR."
            echo "- A security-only merge normally does not cut a release because VERSION is already tagged; an untagged pending VERSION on main can publish. Merge main back into testing; the next versioned promotion releases the change."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # `required` is never skipped for a release event and transitively waits
    # for the full gate when the full gate runs. A merged promotion PR carries
    # the exact merge commit and releases even when GitHub drops the separate
    # main push event. A delivered main push or manually pushed tag reuses the
    # same reviewed merge and tag idempotency guard. Docs/site-only changes are
    # handled by the docs and Pages workflows and do not publish an image.
    needs: required
    # always() defeats GitHub's implicit success gate, which otherwise skips
    # this job when checks and container were deliberately skipped for a main
    # push or a merged PR. The explicit result check still requires the
    # required gate to pass.
    if: >-
      always() && needs.required.result == 'success' &&
      github.repository == 'LLM-4-People/millivolt' &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true && github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.required.outputs.merged_docs_only != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GOTOOLCHAIN: local
    # A main push whose VERSION is already tagged, normally a Dependabot
    # security merge, skips the image and release steps. The required check
    # prevents an ordinary promotion from reaching that state.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A merged PR event's github.sha is the PR merge ref, not the
          # reviewed merge commit on main. Release exactly the event payload's
          # merge commit; branch and tag pushes keep their ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release target
        if: github.event_name == 'pull_request'
        env:
          EXPECTED: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Release checkout is $actual, expected merged commit $EXPECTED."
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cut the next version
        id: cut
        run: |
          set -euo pipefail
          skip=false
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A manually pushed release tag ships exactly as tagged. HEAD is
            # the commit even when the tag object is annotated.
            version="${GITHUB_REF_NAME#v}"
            revision="$(git rev-parse HEAD)"
          else
            file_version="$(tr -d '\r\n' < VERSION)"
            if git rev-parse -q --verify "refs/tags/v$file_version" >/dev/null; then
              # Dependabot security merges reach main without a VERSION bump.
              # They stay unreleased until the next versioned promotion.
              echo "VERSION v$file_version is already tagged; no release is needed."
              skip=true
            else
              # A promotion PR owns the version bump. Tag its merge commit
              # exactly as reviewed; the release workflow never creates a
              # commit on main.
              version="$file_version"
              revision="$(git rev-parse HEAD)"
              git config user.name "millivolt-release-bot"
              git config user.email "millivolt-release-bot@users.noreply.github.com"
              git tag -a "v$version" -m "millivolt $version" "$revision"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "false" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "revision=$revision" >> "$GITHUB_OUTPUT"
            echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          fi
      - name: Validate release identity
        id: release
        if: steps.cut.outputs.skip != 'true'
        env:
          REVISION: ${{ steps.cut.outputs.revision }}
          RELEASE_TAG: v${{ steps.cut.outputs.version }}
        run: |
          args=(release -revision "$REVISION" -tag "$RELEASE_TAG")
          bash scripts/check.sh "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Define image tags and labels
        id: meta
        if: steps.cut.outputs.skip != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/llm-4-people/millivolt
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')) && !contains(env.RELEASE_VERSION, '-') }}
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            # Source the sha tag from the cut revision the build and OCI
            # revision label use. The version bump belongs to the promotion
            # PR, so this is the reviewed merge commit.
            type=raw,value=sha-${{ steps.cut.outputs.revision }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' && !contains(env.RELEASE_VERSION, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ steps.cut.outputs.revision }}
            org.opencontainers.image.source=https://github.com/LLM-4-People/millivolt
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.cut.outputs.skip != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.cut.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-platform image
        id: image
        if: steps.cut.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ steps.cut.outputs.revision }}
          # Reuse both native check scopes, which already hold the expensive
          # Go layers for each platform. Export only the final image layers
          # under a publish-only scope: a max export here would duplicate both
          # platform graphs into the repository's shared 10 GB cache budget.
          cache-from: |
            type=gha,scope=millivolt-container-linux-amd64
            type=gha,scope=millivolt-container-linux-arm64
          cache-to: type=gha,mode=min,scope=millivolt-publish-multiarch,ignore-error=true
      - name: Push verified tag
        if: steps.cut.outputs.skip != 'true' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The image exists before the tag becomes public. Main already
          # contains the promotion merge; the release workflow never pushes
          # main. A failed build leaves no public release.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "v$RELEASE_VERSION"
      - name: Create the GitHub release
        if: steps.cut.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Notes come from the real commit log since the previous release
          # tag (push-based work has no PRs for --generate-notes to list).
          previous="$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')"
          {
            echo "## What's included"
            if [ -n "$previous" ]; then
              git log --no-merges --no-decorate --format='- %h %s' "$previous..v$RELEASE_VERSION" \
                | awk '{ subject=$0; sub(/^- [0-9a-f]+ /, "", subject); if (subject ~ /^bump version to /) next; if (seen[subject]++) next; print }'
            else
              git log --no-merges --no-decorate --format='- %h %s' \
                | awk '{ subject=$0; sub(/^- [0-9a-f]+ /, "", subject); if (subject ~ /^bump version to /) next; if (seen[subject]++) next; print }'
            fi
            echo
            echo "**Image:** \`ghcr.io/llm-4-people/millivolt:${RELEASE_VERSION}\`"
            if [ -n "${{ steps.image.outputs.digest }}" ]; then
              echo "**Digest:** \`${{ steps.image.outputs.digest }}\`"
            fi
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/LLM-4-People/millivolt/compare/${previous}...v${RELEASE_VERSION}"
            fi
          } > release-notes.md
          flags=(--verify-tag --title "millivolt $RELEASE_VERSION" --notes-file release-notes.md)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release view "v$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "v$RELEASE_VERSION" "${flags[@]}"

  publish-testing:
    needs: [checks, container]
    # A moving development alias, not a release: every code-bearing push to
    # testing republishes one tag after the same checks and native container
    # gates as main. It waits for those jobs directly because a testing push
    # has no promotion proof to wait for. No version is cut and no release is
    # created.
    if: github.event_name == 'push' && github.repository == 'LLM-4-People/millivolt' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: publish-testing
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the testing version
        id: version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish testing image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/llm-4-people/millivolt:testing
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/LLM-4-People/millivolt
            org.opencontainers.image.licenses=MIT
          build-args: REVISION=${{ github.sha }}
          # Same reuse and bounded-export policy as publish, with a separate
          # scope so testing never overwrites or evicts the release cache.
          cache-from: |
            type=gha,scope=millivolt-container-linux-amd64
            type=gha,scope=millivolt-container-linux-arm64
          cache-to: type=gha,mode=min,scope=millivolt-publish-testing-multiarch,ignore-error=true
