name: Checks and images

on:
  push:
    # Docs-only pushes never cut a release or rebuild images.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate clean source identity
        env:
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(release -revision "$REVISION")
          if [ -n "$RELEASE_TAG" ]; then args+=(-tag "$RELEASE_TAG"); fi
          bash scripts/check.sh "${args[@]}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Check source and unit tests
        run: bash scripts/check.sh
      - name: Check isolated browser fixtures
        env:
          DEV_PORT: "18081"
          DEV_HOST: "127.0.0.1"
          DEV_DB: "/tmp/millivolt/millivolt-dev-ci.db"
          DEV_CONFIG: "proxy.example.yaml"
          DEV_COPY_DB: "0"
          # The dev instance and the browser harnesses share this operator
          # credential: the dashboard gate is fail closed, and the harnesses
          # sign in through it for gated fixture cleanup.
          MILLIVOLT_OPERATOR_TOKEN: "ci-browser-fixture-credential"
        run: |
          trap 'scripts/dev.sh stop' EXIT
          scripts/dev.sh up
          bash scripts/check.sh browser --target "http://${DEV_HOST}:${DEV_PORT}"

  container:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build native image without publishing
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: millivolt:check
          build-args: REVISION=${{ github.sha }}
      - name: Check isolated container
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash scripts/check.sh container --image "$IMAGE_ID"

  publish:
    needs: [checks, container]
    if: github.event_name == 'push' && github.repository == 'LLM-4-People/millivolt' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cut the next version
        id: cut
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A manually pushed release tag ships exactly as tagged.
            version="${GITHUB_REF_NAME#v}"
            revision="${{ github.sha }}"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')"
            file_version="$(tr -d '\r\n' < VERSION)"
            # The higher of VERSION and the newest tag owns the base: a
            # promotion merge carrying an older VERSION self-heals instead of
            # regressing a published release.
            target="$(printf '%s\n%s\n' "$file_version" "$latest" | sort -V | tail -n1)"
            if git rev-parse -q --verify "refs/tags/v$target" >/dev/null; then
              # That version is already released and code changed since it:
              # cut the next patch (dropping any prerelease suffix).
              base="${target%%-*}"
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            else
              # An untagged VERSION (manual bump or promotion) ships as-is.
              version="$target"
            fi
            if [ "$version" != "$file_version" ]; then
              printf '%s\n' "$version" > VERSION
              git config user.name "millivolt-release-bot"
              git config user.email "millivolt-release-bot@users.noreply.github.com"
              git add VERSION
              git commit -m "bump version to $version"
            fi
            revision="$(git rev-parse HEAD)"
            git tag -a "v$version" -m "millivolt $version" "$revision"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:main" "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate release identity
        id: release
        env:
          REVISION: ${{ steps.cut.outputs.revision }}
          RELEASE_TAG: v${{ steps.cut.outputs.version }}
        run: |
          args=(release -revision "$REVISION" -tag "$RELEASE_TAG")
          bash scripts/check.sh "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub release
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Notes come from the real commit log since the previous release
          # tag (push-based work has no PRs for --generate-notes to list).
          previous="$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')"
          {
            echo "## What's included"
            if [ -n "$previous" ]; then
              git log --no-decorate --format='- %h %s' "$previous..v$RELEASE_VERSION"
            else
              git log --no-decorate --format='- %h %s'
            fi
            echo
            echo "**Image:** \`ghcr.io/${REPO}:${RELEASE_VERSION}\`"
          } > release-notes.md
          flags=(--verify-tag --title "millivolt $RELEASE_VERSION" --notes-file release-notes.md)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release view "v$RELEASE_VERSION" >/dev/null 2>&1 || \
            gh release create "v$RELEASE_VERSION" "${flags[@]}"
      - name: Define image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/llm-4-people/millivolt
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ env.RELEASE_VERSION != '' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' && !contains(env.RELEASE_VERSION, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ steps.cut.outputs.revision }}
            org.opencontainers.image.source=https://github.com/LLM-4-People/millivolt
            org.opencontainers.image.licenses=MIT
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ steps.cut.outputs.revision }}
