name: Docs checks

on:
  push:
    # The main checks workflow skips docs-only pushes so they never cut a
    # release or rebuild images. This small unfiltered job still validates
    # Markdown links, anchors and typography on those pushes.
    paths:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check Markdown links, anchors and typography
        run: python3 -B -m tests.repository_check
