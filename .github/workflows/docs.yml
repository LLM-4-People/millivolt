name: Docs checks

on:
  push:
    # GitHub runs a push workflow only for the ref kinds it names. With
    # tags-ignore alone and no branches, this job never fired on a branch
    # push: 226 commits touching Markdown landed on testing unvalidated while
    # check.yml skipped them by path. Naming both ref kinds is what makes the
    # paths filter below apply to the pushes it was written for.
    branches:
      - main
      - testing
    tags-ignore:
      - '**'
    # The main checks workflow skips docs and site-only pushes so they never
    # cut a release or rebuild images. This small job still validates Markdown
    # links, anchors, typography, the generated site, and the docs contract
    # tests that pin hand-written documentation to its code owners.
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'scripts/site_llm.py'
      - 'requirements-docs.txt'
      - 'internal/docs/**'
      - 'internal/web/static/css/themes.css'
      - 'internal/web/static/js/theme_boot.js'
      - 'internal/web/static/js/theme_state.js'
      - 'tests/python/site.py'
      - 'tests/python/mcp_docs.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'scripts/site_llm.py'
      - 'requirements-docs.txt'
      - 'internal/docs/**'
      - 'internal/web/static/css/themes.css'
      - 'internal/web/static/js/theme_boot.js'
      - 'internal/web/static/js/theme_state.js'
      - 'tests/python/site.py'
      - 'tests/python/mcp_docs.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python3 -m pip install --require-hashes -r requirements-docs.txt
      - name: Check Markdown links, anchors and typography
        run: python3 -B -m tests.repository_check
      - name: Check documentation prose readability
        run: python3 -B -O -m tests.python.docs_readability
      - name: Build and validate the static site
        run: python3 -B -O -m tests.python.site
      - name: Check workflow and automation policy
        run: python3 -B -O -m tests.python.workflows
      - name: Check documentation contracts
        run: |
          python3 -B -O -m tests.python.repository
          python3 -B -m tests.go test -mod=readonly ./internal/mcp -count=1
