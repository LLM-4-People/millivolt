name: Docs checks

on:
  push:
    tags-ignore:
      - '**'
    # The main checks workflow skips docs and site-only pushes so they never
    # cut a release or rebuild images. This small job still validates Markdown
    # links, anchors, typography, the generated site, and the docs contract
    # tests that pin hand-written documentation to its code owners.
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'requirements-docs.txt'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'requirements-docs.txt'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Check Markdown links, anchors and typography
        run: python3 -B -m tests.repository_check
      - name: Build and validate the static site
        run: python3 -B -O -m tests.python.site
      - name: Check workflow and automation policy
        run: python3 -B -O -m tests.python.workflows
      - name: Check documentation contracts
        run: |
          python3 -B -O -m tests.python.repository
          python3 -B -m tests.go test -mod=readonly ./internal/mcp -count=1
