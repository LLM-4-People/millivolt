name: Documentation site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'site-src/**'
      - 'scripts/build_site.py'
      - 'requirements-docs.txt'
      - 'VERSION'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'internal/web/static/css/dashboard.css'
      - 'internal/web/static/favicon.svg'
      - 'internal/web/static/favicon.ico'
      - 'internal/web/static/apple-touch-icon.png'
      - 'tests/repository_check.py'
      - 'tests/support.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and validate the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$SITE_URL"
          python3 -B -O -m tests.python.site
          python3 scripts/build_site.py --output site --base-url "$SITE_URL"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
