name: millivolt

services:
  millivolt:
    image: ${MILLIVOLT_IMAGE:-ghcr.io/llm-4-people/millivolt:main}
    ports:
      - "127.0.0.1:${MILLIVOLT_PORT:-8080}:8080"
    environment:
      # The operator credential is env-only by design: it never enters the
      # config volume or Settings output. Empty leaves the gate armed but
      # disabled, so the dashboard stays denied until a value is set here.
      MILLIVOLT_OPERATOR_TOKEN: ${MILLIVOLT_OPERATOR_TOKEN:-}
    volumes:
      - data:/data
      - config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # SIGTERM cancels streams. Allow time beyond shutdown_timeout for SQLite
    # draining; this grace is configurable, not a lossless shutdown guarantee.
    stop_grace_period: ${MILLIVOLT_STOP_GRACE_PERIOD:-30s}

volumes:
  data:
  config:
