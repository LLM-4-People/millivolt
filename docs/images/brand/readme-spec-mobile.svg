<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" role="img" aria-labelledby="title desc">
  <title id="title">millivolt at a glance</title>
  <desc id="desc">Three client protocols, one Go binary, 22 MCP tools, one operator plane.</desc>
  <defs>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="799" height="383" rx="18"/>
    </clipPath>
    <pattern id="ticks" width="24" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0V4" stroke="#7aa0ff" stroke-opacity=".32"/>
