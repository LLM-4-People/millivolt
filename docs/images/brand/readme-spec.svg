<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="144" viewBox="0 0 1600 144" role="img" aria-labelledby="title desc">
  <title id="title">millivolt at a glance</title>
  <desc id="desc">Three client protocols, one Go binary, 22 MCP tools, one operator plane.</desc>
  <defs>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="1599" height="143" rx="18"/>
    </clipPath>
    <pattern id="ticks" width="24" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0V4" stroke="#7aa0ff" stroke-opacity=".32"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="1599" height="143" rx="18" fill="#141210"/>
    <rect x="0" y="0" width="1600" height="8" fill="url(#ticks)"/>
    <rect x="0.5" y="0.5" width="1599" height="143" rx="18" fill="none" stroke="#3a342b"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="32" y="29" font-size="18" letter-spacing="3"><tspan fill="#97907e">MILLIVOLT </tspan><tspan fill="#7aa0ff">/ SPEC</tspan></text>
      <text x="1568" y="29" fill="#6b655d" font-size="15" letter-spacing="2.4" text-anchor="end">READOUT / 01</text>
      <path d="M32 44H1568" stroke="#2a2622"/>
      <path d="M400 58V128M800 58V128M1200 58V128" stroke="#2a2622"/>
      <g fill="#e8e4de" font-size="64" font-weight="500">
        <text x="32" y="101">03</text>
        <text x="432" y="101">01</text>
        <text x="832" y="101">22</text>
        <text x="1232" y="101">01</text>
      </g>
      <g fill="#97907e" font-size="24" letter-spacing="2">
        <text x="32" y="126">CLIENT PROTOCOLS</text>
        <text x="432" y="126">GO BINARY</text>
        <text x="832" y="126">MCP TOOLS</text>
        <text x="1232" y="126">OPERATOR PLANE</text>
      </g>
    </g>
  </g>
