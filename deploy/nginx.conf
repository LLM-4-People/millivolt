# Example server block for inclusion inside an existing NGINX http context.
# Replace the hostname, TLS files and TEST-NET allowlists before deployment.
# This example assumes NGINX runs on the host, beside the normal Compose service.
#
# Two locations: OpenAI-compatible inference under /v1, and the dashboard /
# operator plane everywhere else. They share streaming proxy settings and can
# take different allowlists or header rules. Do not host millivolt under a
# subpath: dashboard assets and routes expect the origin root.
server {
    listen 443 ssl;
    http2 on;
    server_name millivolt.example.com;

    ssl_certificate /etc/nginx/tls/millivolt/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/millivolt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The application owns max_request_bytes; avoid a second upload-size default
    # on the inference path. Dashboard posts inherit this too.
    client_max_body_size 0;

    # Shared forwarding. Both planes stream (chat completions and the dashboard
    # live feed) and must not be retried, buffered, cached or recompressed at
    # the edge. Host is preserved so dashboard origin checks keep working.
    # TLS is not authorization. proxy_pass has no URI so the original path
    # reaches millivolt (see ngx_http_proxy_module).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    # A provider or dashboard response must not reconfigure this ingress.
    proxy_ignore_headers X-Accel-Buffering X-Accel-Redirect X-Accel-Limit-Rate
                         X-Accel-Expires X-Accel-Charset;
    gzip off;
    # Operator-selected idle examples, not overall stream-lifetime limits.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Inference: OpenAI-compatible API base. Preserve provider Authorization
    # (and X-Proxy-Key / X-Proxy-* routing headers). Do not add HTTP Basic
    # here: it would consume Authorization. Allowlist API clients; it may
    # differ from the operator allowlist below.
    location /v1 {
        allow 192.0.2.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Dashboard and operator plane: /, /dash/, /metrics/, /admin/, /healthz,
    # /favicon.ico and the other brand/PWA files. Allowlist operators. Session
    # cookie and Bearer must reach millivolt; do not steal Authorization with
    # Basic auth. /healthz and brand/PWA files stay unauthenticated at millivolt,
    # but still need to pass this allowlist. GET /models without /v1 is
    # inference and follows this location unless you add an exact /models
    # block with the /v1 rules.
    location / {
        allow 192.0.2.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }
}
