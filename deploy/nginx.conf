# Example server block for inclusion inside an existing NGINX http context.
# Replace the hostname, TLS files and TEST-NET allowlist before deployment.
# This example assumes NGINX runs on the host, beside the normal Compose service.
server {
    listen 443 ssl;
    http2 on;
    server_name millivolt.example.com;

    ssl_certificate /etc/nginx/tls/millivolt/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/millivolt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every allowed caller is a trusted operator. TLS is not authorization.
    allow 192.0.2.1;
    deny all;

    # The application owns max_request_bytes; avoid a second upload-size default.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        # A provider response must not reconfigure this ingress.
        proxy_ignore_headers X-Accel-Buffering X-Accel-Redirect X-Accel-Limit-Rate
                             X-Accel-Expires X-Accel-Charset;
        gzip off;

        # Operator-selected idle examples, not overall stream-lifetime limits.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
